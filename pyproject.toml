[project]
name = "pytide"
version = "0.6.0"
description = "Pytide: A tool for emailing high- and low-tide events."
readme = "README.md"
authors = [
    { name = "James Pfeifer", email = "pfeif@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "astronomy-engine>=2.1.19",
    "click>=8.3.3",
    "jinja2>=3.1.6",
    "platformdirs>=4.9.6",
    "requests>=2.34.2",
    "timezonefinder[numba]>=8.2.4",
    "tzdata>=2026.2",
]

[project.scripts]
pytide = "pytide.cli:main"

[build-system]
requires = ["uv_build>=0.11.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "ruff>=0.15.13",
    "types-requests>=2.33.0.20260513",
]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "single"
